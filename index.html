<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>発熱ユニット数</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#182f36;background:#f1f5f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:48px 20px}main{max-width:880px;margin:auto}header{margin-bottom:28px}.eyebrow{color:#357b70;font-size:12px;font-weight:700;letter-spacing:.16em}h1{font-size:30px;margin:10px 0}p{line-height:1.8;color:#5e7175;font-size:14px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #dce6e3;border-radius:18px;padding:26px;box-shadow:0 6px 20px #16392c05}h2{font-size:17px;margin:0 0 24px}.field{display:grid;grid-template-columns:1fr 120px 36px;align-items:center;gap:10px;margin:18px 0}label{font-size:14px}input{width:100%;border:1px solid #bdcfca;border-radius:8px;padding:10px;font:600 18px system-ui;text-align:right;color:#193b34;background:#fbfdfc}input[readonly]{background:#edf2f0;color:#5e7175;border-color:#dce6e3}input:focus{outline:3px solid #b9e6d9;border-color:#277a63}.unit{font-size:12px;color:#667c76}.rule{border-top:1px solid #e6ecea;margin-top:24px;padding-top:8px}.result{margin-top:20px;background:#123f35;color:white;padding:28px;border-radius:18px}.result h2{margin-bottom:8px}.result p{color:#c7ded7}.total{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums}.total small{font-size:15px;font-weight:400;margin-left:12px}.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-top:1px solid #ffffff26;margin-top:24px;padding-top:20px}.breakdown span{font-size:12px;color:#c7ded7;display:block}.breakdown strong{font-size:22px;display:block;margin-top:6px}#status{min-height:25px;margin-bottom:0}.formula{font-size:12px}.actions{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:24px}button{cursor:pointer;background:white;color:#244a40;border:1px solid #bacfc7;padding:11px 18px;border-radius:8px;font:inherit;font-size:13px}a{color:#336d5e;font-size:13px}footer{margin-top:24px}#error{color:#a62d2d;min-height:22px;font-size:13px;margin:0}input[aria-invalid=true]{border-color:#b52f2f}@media(max-width:640px){body{padding:28px 16px}.layout{grid-template-columns:1fr}.card{padding:20px}.breakdown{gap:8px}.breakdown strong{font-size:20px}h1{font-size:26px}.actions{align-items:flex-start;flex-direction:column}}@media print{body{background:white;padding:0}.actions,footer{display:none}.card,.result{break-inside:avoid}.result{background:white;color:#182f36;border:1px solid #ccc}.result p,.breakdown span{color:#465b53}}
</style>
</head>
<body><main>
<header><div class="eyebrow">UNIT CALCULATOR</div><h1>発熱ユニット数</h1><p>製造数と梱包数を入力して、ユニット数の差引を確認します。</p></header>
<form id="calculator" novalidate>
<div class="layout">
<section class="card"><h2>梱包設定・製造数</h2>
<div class="field"><label for="perBox">1箱のユニット数</label><input id="perBox" type="number" min="1" step="1" value="54" readonly required><span class="unit">個/箱</span></div>
<div class="field"><label for="perPallet">1パレットの箱数</label><input id="perPallet" type="number" min="1" step="1" value="30" readonly required><span class="unit">箱</span></div>
<div class="rule">
<div class="field"><label for="machine1">1号機良品</label><input id="machine1" type="number" min="0" step="1" value="2002" required><span class="unit">個</span></div>
<div class="field"><label for="machine3">3号機良品</label><input id="machine3" type="number" min="0" step="1" value="2096" required><span class="unit">個</span></div>
</div></section>
<section class="card"><h2>梱包数・製品・不良品</h2>
<div class="field"><label for="pallets">パレット</label><input id="pallets" type="number" min="0" step="1" value="2" required><span class="unit">台</span></div>
<div class="field"><label for="boxes">箱</label><input id="boxes" type="number" min="0" step="1" value="15" required><span class="unit">箱</span></div>
<div class="rule">
<div class="field"><label for="remaining">製品</label><input id="remaining" type="number" min="0" step="1" value="48" required><span class="unit">個</span></div>
<div class="field"><label for="defects">不良品</label><input id="defects" type="number" min="0" step="1" value="2" required><span class="unit">個</span></div>
</div></section></div>
<p id="error" role="alert"></p>
<section class="result" aria-live="polite" aria-atomic="true"><h2>合計（差引）</h2><output class="total" id="total">-2</output><span> 個</span>
<div class="breakdown"><div><span>製造数 合計</span><strong id="produced">4,098</strong></div><div><span>パレット分</span><strong id="palletUnits">3,240</strong></div><div><span>箱分</span><strong id="boxUnits">810</strong></div></div>
<p id="status"></p><p class="formula">計算式：1号機良品 ＋ 3号機良品 − パレット × 1パレットの箱数 × 1箱のユニット数 − 箱 × 1箱のユニット数 − 製品 - 不良品</p></section>
<div class="actions"><button type="reset">リセット</button></div>
</form>
</main>
<script>
'use strict';
const form=document.getElementById('calculator');
const inputs=[...form.querySelectorAll('input')];
const fmt=new Intl.NumberFormat('ja-JP');
const el=id=>document.getElementById(id);
function calculate(v){
 const produced=v.machine1+v.machine3;
 const palletUnits=v.pallets*v.perPallet*v.perBox;
 const boxUnits=v.boxes*v.perBox;
 return {produced,palletUnits,boxUnits,total:produced-palletUnits-boxUnits-v.defects-v.remaining};
}
function update(){
 const v={};let valid=true;
 for(const input of inputs){
  const n=input.valueAsNumber;
  const ok=input.value!==''&&Number.isSafeInteger(n)&&n>=Number(input.min);
  input.setAttribute('aria-invalid',String(!ok));valid=valid&&ok;v[input.id]=n;
 }
 const result=valid?calculate(v):null;
 if(result&&(!Object.values(result).every(Number.isSafeInteger)||!Number.isSafeInteger(result.palletUnits+result.boxUnits+v.defects+v.remaining)))valid=false;
 el('error').textContent=valid?'':'すべての欄に範囲内の整数を入力してください。梱包設定は1以上、その他は0以上です。大きすぎる数値は計算できません。';
 for(const id of ['produced','palletUnits','boxUnits','total'])el(id).textContent=valid?fmt.format(result[id]):'—';
 el('status').textContent=!valid?'入力内容を確認してください。':result.total===0?'製造数と、梱包・不良品・残の合計が一致しています。':result.total<0?`梱包・不良品・残の合計が、製造数を${fmt.format(-result.total)}個上回っています。`:`製造数が、梱包・不良品・残の合計を${fmt.format(result.total)}個上回っています。`;
}
form.addEventListener('input',update);
form.addEventListener('submit',event=>event.preventDefault());
form.addEventListener('reset',event=>{
 event.preventDefault();
 for(const input of inputs){if(!input.readOnly)input.value='0';}
 update();
});
update();
</script></body></html>
